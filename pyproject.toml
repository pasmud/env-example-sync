[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "env-example-sync"
version = "0.1.0"
description = "Inventory Python environment keys and synchronize blank .env.example templates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
env-example-sync = "env_example_sync.__main__:main"

[tool.setuptools]
packages = ["env_example_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
